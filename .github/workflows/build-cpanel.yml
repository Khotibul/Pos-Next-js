name: Build Next.js for cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: posqupro-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

      # Hanya untuk proses build GitHub Actions.
      # BUKAN database production.
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"

      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================================
      # NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Show versions
        run: |
          set -e

          echo "=== Node ==="
          node -v

          echo "=== npm ==="
          npm -v

      # ==========================================================
      # CHECK FILES
      # ==========================================================

      - name: Check required files
        run: |
          set -e

          test -f package.json
          test -f package-lock.json
          test -f next.config.mjs
          test -f src/prisma/schema.prisma
          test -f scripts/seed.mjs

          echo "Required files OK."

      # ==========================================================
      # CHECK NEXT CONFIG
      # ==========================================================

      - name: Check Next.js standalone configuration
        run: |
          set -e

          echo "=== next.config.mjs ==="
          grep -n "standalone" next.config.mjs || true

          echo ""
          echo "=== output / distDir ==="

          grep -nE \
            "output|distDir|DESKTOP_BUILD" \
            next.config.mjs || true

      # ==========================================================
      # CHECK PRISMA
      # ==========================================================

      - name: Check Prisma configuration
        run: |
          set -e

          echo "=== Prisma generator ==="

          grep -n -A20 \
            "^generator client" \
            src/prisma/schema.prisma

          echo ""

          grep -q \
            'debian-openssl-1.0.x' \
            src/prisma/schema.prisma

          grep -q \
            'debian-openssl-1.1.x' \
            src/prisma/schema.prisma

          grep -q \
            'debian-openssl-3.0.x' \
            src/prisma/schema.prisma

          echo "Prisma binary targets OK."

      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          npm ci \
            --include=dev \
            --no-audit \
            --no-fund

      # ==========================================================
      # PRISMA GENERATE
      # ==========================================================

      - name: Generate Prisma Client
        run: |
          set -e

          unset PRISMA_QUERY_ENGINE_LIBRARY

          ./node_modules/.bin/prisma generate \
            --schema src/prisma/schema.prisma

          test -d node_modules/@prisma/client
          test -d node_modules/.prisma/client

          echo ""
          echo "=== Prisma engines ==="

          find node_modules/.prisma/client \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*query_engine*" \
              -o \
              -name "*libquery_engine*" \
            \) \
            -print

      # ==========================================================
      # VERIFY PRISMA ENGINES
      # ==========================================================

      - name: Verify Prisma engines
        run: |
          set -e

          for target in \
            debian-openssl-1.0.x \
            debian-openssl-1.1.x \
            debian-openssl-3.0.x
          do
            echo "Checking $target..."

            test -n "$(find node_modules/.prisma/client \
              -maxdepth 1 \
              -type f \
              -name "*$target*" \
              -print -quit)"

            echo "OK: $target"
          done

      # ==========================================================
      # BUILD NEXT.JS
      # ==========================================================

      - name: Build Next.js
        run: |
          set -e

          npm run build

      # ==========================================================
      # VERIFY BUILD
      # ==========================================================

      - name: Verify Next.js build
        run: |
          set -e

          test -d .next
          test -d .next/standalone

          SERVER_JS=$(find .next/standalone \
            -type f \
            -name "server.js" \
            | head -n 1)

          if [ -z "$SERVER_JS" ]; then
            echo "ERROR: server.js tidak ditemukan."
            exit 1
          fi

          echo "Found:"
          echo "$SERVER_JS"

      # ==========================================================
      # PREPARE CPANEL PACKAGE
      # ==========================================================

      - name: Prepare cPanel package
        run: |
          set -e

          rm -rf cpanel-package
          mkdir -p cpanel-package

          SERVER_JS=$(find .next/standalone \
            -type f \
            -name "server.js" \
            | head -n 1)

          SERVER_DIR=$(dirname "$SERVER_JS")

          echo "Standalone directory:"
          echo "$SERVER_DIR"

          # Copy standalone application
          cp -a \
            "$SERVER_DIR"/. \
            cpanel-package/

          # Copy public
          if [ -d public ]; then
            mkdir -p cpanel-package/public

            cp -a \
              public/. \
              cpanel-package/public/
          fi

          # Copy .next/static
          if [ -d .next/static ]; then
            mkdir -p cpanel-package/.next

            cp -a \
              .next/static \
              cpanel-package/.next/
          fi

          # Server memakai CloudLinux node_modules.
          rm -rf cpanel-package/node_modules

          # Jangan upload environment production.
          rm -f cpanel-package/.env
          rm -f cpanel-package/.env.production
          rm -f cpanel-package/.env.local

          echo ""
          echo "=== Package ==="

          find cpanel-package \
            -maxdepth 2 \
            -type f \
            | sort

      # ==========================================================
      # ADD SEED
      # ==========================================================

      - name: Add Prisma seed
        run: |
          set -e

          mkdir -p cpanel-package/scripts

          cp \
            scripts/seed.mjs \
            cpanel-package/scripts/seed.mjs

      # ==========================================================
      # ADD PRISMA SCHEMA FOR DB PUSH
      # ==========================================================

      - name: Add Prisma schema for db push
        run: |
          set -e

          mkdir -p cpanel-package/src/prisma

          cp \
            src/prisma/schema.prisma \
            cpanel-package/src/prisma/schema.prisma

          echo "Prisma schema added for db push."

      # ==========================================================
      # VERIFY PACKAGE
      # ==========================================================

      - name: Verify cPanel package
        run: |
          set -e

          test -f cpanel-package/server.js
          test -f cpanel-package/package.json
          test -d cpanel-package/.next
          test -f cpanel-package/scripts/seed.mjs

          if [ -e cpanel-package/node_modules ]; then
            echo "ERROR: node_modules masih ada."
            exit 1
          fi

          echo ""
          echo "================================="
          echo "CPANEL PACKAGE READY"
          echo "================================="

          ls -lah cpanel-package

      # ==========================================================
      # ARTIFACT BACKUP
      # ==========================================================

      - name: Upload cPanel package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-next-cpanel
          path: cpanel-package/
          include-hidden-files: true
          retention-days: 7

      # ==========================================================
      # VALIDATE SECRETS
      # ==========================================================

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          set -e

          echo "Checking deployment configuration..."

          test -n "$CPANEL_HOST" || {
            echo "ERROR: CPANEL_HOST kosong."
            exit 1
          }

          test -n "$CPANEL_USER" || {
            echo "ERROR: CPANEL_USER kosong."
            exit 1
          }

          test -n "$CPANEL_PORT" || {
            echo "ERROR: CPANEL_SSH_PORT kosong."
            exit 1
          }

          test -n "$CPANEL_APP_DIR" || {
            echo "ERROR: CPANEL_APP_DIR kosong."
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY_B64" || {
            echo "ERROR: CPANEL_SSH_KEY_B64 kosong."
            exit 1
          }

          if ! echo "$CPANEL_PORT" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: CPANEL_SSH_PORT harus berupa angka."
            exit 1
          fi

          if [ "$CPANEL_APP_DIR" != \
            "/home/ucv04la6/Pos-Next-Js/cpanel-runtime" ]; then

            echo "ERROR: CPANEL_APP_DIR tidak sesuai."
            echo "Expected:"
            echo "/home/ucv04la6/Pos-Next-Js/cpanel-runtime"
            echo "Actual:"
            echo "$CPANEL_APP_DIR"
            exit 1
          fi

          echo ""
          echo "SSH configuration OK."
          echo "Host: $CPANEL_HOST"
          echo "User: $CPANEL_USER"
          echo "Port: $CPANEL_PORT"
          echo "App:  $CPANEL_APP_DIR"
          echo "SSH key: configured"

      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          set -e

          echo "Preparing SSH..."

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          echo "Checking SSH private key..."

          ssh-keygen \
            -y \
            -f ~/.ssh/id_ed25519 \
            > ~/.ssh/id_ed25519.pub

          echo "SSH private key is valid."

          ssh-keyscan \
            -p "$CPANEL_PORT" \
            "$CPANEL_HOST" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          echo "SSH ready."

      # ==========================================================
      # TEST SSH
      # ==========================================================

      - name: Test SSH connection
        run: |
          set -e

          echo "Testing SSH connection..."

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo SSH_OK"

      # ==========================================================
      # REMOTE BACKUP
      # ==========================================================

      - name: Backup current deployment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'
              BACKUP=\"\${APP}.backup-\$(date +%Y%m%d-%H%M%S)\"

              mkdir -p \"\$BACKUP\"

              if [ -f \"\$APP/server.js\" ]; then
                cp -a \"\$APP/server.js\" \"\$BACKUP/\"
              fi

              if [ -d \"\$APP/.next\" ]; then
                cp -a \"\$APP/.next\" \"\$BACKUP/\"
              fi

              if [ -d \"\$APP/public\" ]; then
                cp -a \"\$APP/public\" \"\$BACKUP/\"
              fi

              if [ -f \"\$APP/package.json\" ]; then
                cp -a \"\$APP/package.json\" \"\$BACKUP/\"
              fi

              echo \"Backup created: \$BACKUP\"
            "

      # ==========================================================
      # DEPLOY FILES
      # ==========================================================

      - name: Deploy application files
        run: |
          set -e

          tar \
            -C cpanel-package \
            -czf - . \
          | ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              mkdir -p \"\$APP\"

              tar -xzf - -C \"\$APP\"

              echo ''
              echo 'Deployment files extracted.'
            "

      # ==========================================================
      # VERIFY / REPAIR NODE_MODULES SYMLINK
      # ==========================================================

      - name: Verify CloudLinux node_modules
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              EXPECTED='/home/ucv04la6/nodevenv/Pos-Next-Js/cpanel-runtime/22/lib/node_modules'

              echo '=== node_modules ==='

              if [ -L \"\$APP/node_modules\" ]; then

                TARGET=\$(readlink \"\$APP/node_modules\")

                echo \"Symlink: \$TARGET\"

                if [ \"\$TARGET\" != \"\$EXPECTED\" ]; then
                  echo 'ERROR: node_modules symlink salah.'
                  exit 1
                fi

              elif [ -e \"\$APP/node_modules\" ]; then

                echo 'ERROR: node_modules bukan symlink.'
                exit 1

              else

                echo 'node_modules symlink tidak ada.'
                echo 'Membuat ulang...'

                ln -s \
                  \"\$EXPECTED\" \
                  \"\$APP/node_modules\"
              fi

              echo ''
              echo 'node_modules OK.'

              echo ''
              echo '=== Install production dependencies ==='

              cd \"\$APP\"
              \"\$APP/../22/bin/npm\" install --omit=dev --no-audit --no-fund 2>&1 || {
                echo 'npm install failed, trying with npx...'
                npx npm install --omit=dev --no-audit --no-fund 2>&1 || echo 'WARNING: npm install failed'
              }

              cd \"\$APP\"

              echo ''
              echo '=== Generate Prisma client ==='

              set -a
              . ./.env
              set +a

              \"\$APP/../22/bin/npx\" prisma generate --schema src/prisma/schema.prisma 2>&1 || {
                echo 'npx prisma generate failed, trying direct...'
                ./node_modules/.bin/prisma generate --schema src/prisma/schema.prisma 2>&1 || echo 'WARNING: prisma generate failed'
              }

              cd \"\$APP\"

              test -d \"\$APP/node_modules/@prisma/client\"
              test -d \"\$APP/node_modules/.prisma/client\"

              test -f \
                \"\$APP/node_modules/.prisma/client/libquery_engine-debian-openssl-1.1.x.so.node\"

              echo ''
              echo 'Prisma runtime OK.'
            "

      # ==========================================================
      # VERIFY .ENV
      # ==========================================================

      - name: Verify production environment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              test -f \"\$APP/.env\"

              echo '.env exists.'

              grep '^DATABASE_URL=' \
                \"\$APP/.env\" \
                | sed 's/=.*$/=<SET>/'
            "

      # ==========================================================
      # PRISMA DB PUSH (schema migration)
      # ==========================================================

      - name: Run Prisma db push
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'
              NODE='/home/ucv04la6/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/node'

              cd \"\$APP\"

              set -a
              . ./.env
              set +a

              echo '=== Running prisma db push ==='

              npx prisma db push \
                --schema src/prisma/schema.prisma \
                --accept-data-loss \
                --skip-generate 2>&1 || {
                  echo 'prisma db push failed, trying with direct prisma...'
                  ./node_modules/.bin/prisma db push \
                    --schema src/prisma/schema.prisma \
                    --accept-data-loss \
                    --skip-generate 2>&1 || echo 'WARNING: db push failed, tables may be missing'
                }

              echo ''
              echo '=== prisma db push OK ==='
            "

      # ==========================================================
      # RESTART NEXT.JS 3210
      # ==========================================================

      - name: Restart Next.js 3210
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'
              NODE='/home/ucv04la6/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/node'

              mkdir -p \"\$APP/tmp\"

              echo '=== Stop existing Next.js ==='

              if [ -f \"\$APP/tmp/next-3210.pid\" ]; then
                PID=\$(cat \"\$APP/tmp/next-3210.pid\" 2>/dev/null || true)
                if [ -n \"\$PID\" ]; then
                  echo \"Stopping PID \$PID...\"
                  kill \"\$PID\" 2>/dev/null || true
                fi
              fi

              sleep 2

              echo '=== Check port 3210 ==='

              PIDS=\$(fuser -n tcp 3210 2>/dev/null || true)
              if [ -n \"\$PIDS\" ]; then
                echo \"Processes still using port 3210: \$PIDS\"
                kill \$PIDS 2>/dev/null || true
                sleep 2
              fi

              echo '=== Verify runtime ==='

              test -f \"\$APP/server.js\"
              test -L \"\$APP/node_modules\"
              test -f \"\$APP/.env\"
              test -x \"\$NODE\"

              cd \"\$APP\"

              set -a
              . ./.env
              set +a

              echo '=== Start Next.js ==='

              nohup env \
                NODE_ENV=production \
                HOSTNAME=127.0.0.1 \
                PORT=3210 \
                \"\$NODE\" \
                server.js \
                > tmp/next-3210.log 2>&1 &

              NEW_PID=\$!
              echo \"\$NEW_PID\" > tmp/next-3210.pid
              echo \"Started PID: \$NEW_PID\"

              echo ''
              echo '=== Waiting for Next.js to be ready ==='

              READY=0
              for i in \$(seq 1 30); do
                sleep 2

                if ! kill -0 \"\$NEW_PID\" 2>/dev/null; then
                  echo \"ERROR: Process died at attempt \$i.\"
                  echo ''
                  echo '=== next-3210.log ==='
                  cat tmp/next-3210.log || true
                  exit 1
                fi

                if curl --fail --silent --max-time 5 http://127.0.0.1:3210/ -o /dev/null 2>/dev/null; then
                  READY=1
                  echo \"Server ready after \$((i * 2)) seconds.\"
                  break
                fi

                echo \"  attempt \$i/30 (waited \$((i * 2))s)...\"
              done

              if [ \"\$READY\" != \"1\" ]; then
                echo 'ERROR: Server not ready after 60 seconds.'
                echo ''
                echo '=== Process status ==='
                if kill -0 \"\$NEW_PID\" 2>/dev/null; then
                  echo 'Process is alive but not responding.'
                else
                  echo 'Process is DEAD.'
                fi
                echo ''
                echo '=== Port 3210 ==='
                ss -lntp 2>/dev/null | grep ':3210' || echo 'Port 3210 not in use'
                echo ''
                echo '=== Last 150 lines of next-3210.log ==='
                tail -150 tmp/next-3210.log || true
                exit 1
              fi

              echo ''
              echo '=== Port 3210 ==='
              ss -lntp 2>/dev/null | grep ':3210' || true

              echo ''
              echo '=== Last 40 lines of next-3210.log ==='
              tail -40 tmp/next-3210.log || true
            "

      # ==========================================================
      # HEALTH CHECK LOCAL
      # ==========================================================

      - name: Health check Next.js
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              echo '=== Local HTTP 3210 ==='

              HEALTHY=0
              for i in 1 2 3; do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 20 \
                  http://127.0.0.1:3210/ \
                  -o /tmp/next-health.html; then

                  if grep -q 'POSQU' /tmp/next-health.html; then
                    HEALTHY=1
                    echo 'NEXT_HEALTH_OK'
                    break
                  else
                    echo \"Health check attempt \$i: response received but content mismatch.\"
                  fi
                else
                  echo \"Health check attempt \$i: curl failed.\"
                fi
                sleep 3
              done

              if [ \"\$HEALTHY\" != \"1\" ]; then
                echo 'HEALTH_CHECK_FAILED'
                echo ''

                echo '=== Process status ==='
                if [ -f \"\$APP/tmp/next-3210.pid\" ]; then
                  PID=\$(cat \"\$APP/tmp/next-3210.pid\" 2>/dev/null || true)
                  if [ -n \"\$PID\" ] && kill -0 \"\$PID\" 2>/dev/null; then
                    echo \"Process \$PID is alive\"
                  else
                    echo 'Process is DEAD'
                  fi
                else
                  echo 'No PID file found'
                fi

                echo ''
                echo '=== Port 3210 ==='
                ss -lntp 2>/dev/null | grep ':3210' || echo 'Port 3210 not in use'

                echo ''
                echo '=== Last 200 lines of next-3210.log ==='
                tail -200 \"\$APP/tmp/next-3210.log\" || true

                echo ''
                echo '=== Disk space ==='
                df -h \"\$APP\" || true

                echo ''
                echo '=== Memory ==='
                free -h || true

                exit 1
              fi
            "

      # ==========================================================
      # VERIFY REMOTE DEPLOYMENT
      # ==========================================================

      - name: Verify remote deployment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              test -f \"\$APP/server.js\"
              test -f \"\$APP/package.json\"
              test -d \"\$APP/.next\"
              test -f \"\$APP/.env\"
              test -L \"\$APP/node_modules\"
              test -f \"\$APP/tmp/next-3210.pid\"

              echo ''
              echo '================================='
              echo 'DEPLOYMENT VERIFIED'
              echo '================================='
            "
