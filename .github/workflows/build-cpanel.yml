name: Build Next.js for cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: posqupro-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

      # Hanya untuk proses build GitHub Actions.
      # BUKAN database production.
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"

      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================================
      # NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Show versions
        run: |
          set -e

          echo "=== Node ==="
          node -v

          echo "=== npm ==="
          npm -v

      # ==========================================================
      # CHECK FILES
      # ==========================================================

      - name: Check required files
        run: |
          set -e

          test -f package.json
          test -f package-lock.json
          test -f next.config.mjs
          test -f src/prisma/schema.prisma
          test -f scripts/seed.mjs

          echo "Required files OK."

      # ==========================================================
      # CHECK NEXT CONFIG
      # ==========================================================

      - name: Check Next.js standalone configuration
        run: |
          set -e

          echo "=== next.config.mjs ==="
          grep -n "standalone" next.config.mjs || true

          echo ""
          echo "=== output / distDir ==="

          grep -nE \
            "output|distDir|DESKTOP_BUILD" \
            next.config.mjs || true

      # ==========================================================
      # CHECK PRISMA
      # ==========================================================

      - name: Check Prisma configuration
        run: |
          set -e

          echo "=== Prisma generator ==="

          grep -n -A20 \
            "^generator client" \
            src/prisma/schema.prisma

          echo ""

          grep -q \
            'debian-openssl-1.0.x' \
            src/prisma/schema.prisma

          grep -q \
            'debian-openssl-1.1.x' \
            src/prisma/schema.prisma

          grep -q \
            'debian-openssl-3.0.x' \
            src/prisma/schema.prisma

          echo "Prisma binary targets OK."

      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          npm ci \
            --include=dev \
            --no-audit \
            --no-fund

      # ==========================================================
      # PRISMA GENERATE
      # ==========================================================

      - name: Generate Prisma Client
        run: |
          set -e

          unset PRISMA_QUERY_ENGINE_LIBRARY

          ./node_modules/.bin/prisma generate \
            --schema src/prisma/schema.prisma

          test -d node_modules/@prisma/client
          test -d node_modules/.prisma/client

          echo ""
          echo "=== Prisma engines ==="

          find node_modules/.prisma/client \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*query_engine*" \
              -o \
              -name "*libquery_engine*" \
            \) \
            -print

      # ==========================================================
      # VERIFY PRISMA ENGINES
      # ==========================================================

      - name: Verify Prisma engines
        run: |
          set -e

          for target in \
            debian-openssl-1.0.x \
            debian-openssl-1.1.x \
            debian-openssl-3.0.x
          do
            echo "Checking $target..."

            test -n "$(find node_modules/.prisma/client \
              -maxdepth 1 \
              -type f \
              -name "*$target*" \
              -print -quit)"

            echo "OK: $target"
          done

      # ==========================================================
      # BUILD NEXT.JS
      # ==========================================================

      - name: Build Next.js
        run: |
          set -e

          npm run build

      # ==========================================================
      # VERIFY BUILD
      # ==========================================================

      - name: Verify Next.js build
        run: |
          set -e

          test -d .next
          test -d .next/standalone

          SERVER_JS=$(find .next/standalone \
            -type f \
            -name "server.js" \
            | head -n 1)

          if [ -z "$SERVER_JS" ]; then
            echo "ERROR: server.js tidak ditemukan."
            exit 1
          fi

          echo "Found:"
          echo "$SERVER_JS"

      # ==========================================================
      # PREPARE CPANEL PACKAGE
      #
      # TIDAK membawa node_modules.
      #
      # Server menggunakan CloudLinux venv:
      #
      # cpanel-runtime/node_modules
      #       ↓
      # nodevenv/.../22/lib/node_modules
      #
      # ==========================================================

      - name: Prepare cPanel package
        run: |
          set -e

          rm -rf cpanel-package
          mkdir -p cpanel-package

          SERVER_JS=$(find .next/standalone \
            -type f \
            -name "server.js" \
            | head -n 1)

          SERVER_DIR=$(dirname "$SERVER_JS")

          echo "Standalone directory:"
          echo "$SERVER_DIR"

          # Copy standalone application
          cp -a \
            "$SERVER_DIR"/. \
            cpanel-package/

          # Copy public
          if [ -d public ]; then
            mkdir -p cpanel-package/public

            cp -a \
              public/. \
              cpanel-package/public/
          fi

          # Copy .next/static
          if [ -d .next/static ]; then
            mkdir -p cpanel-package/.next

            cp -a \
              .next/static \
              cpanel-package/.next/
          fi

          # Jangan membawa node_modules.
          rm -rf cpanel-package/node_modules

          # Jangan membawa environment files.
          rm -f cpanel-package/.env
          rm -f cpanel-package/.env.production
          rm -f cpanel-package/.env.local

          echo ""
          echo "=== Package ==="

          find cpanel-package \
            -maxdepth 2 \
            -type f \
            | sort

      # ==========================================================
      # ADD SEED
      # ==========================================================

      - name: Add Prisma seed
        run: |
          set -e

          mkdir -p cpanel-package/scripts

          cp \
            scripts/seed.mjs \
            cpanel-package/scripts/seed.mjs

      # ==========================================================
      # VERIFY PACKAGE
      # ==========================================================

      - name: Verify cPanel package
        run: |
          set -e

          test -f cpanel-package/server.js
          test -f cpanel-package/package.json
          test -d cpanel-package/.next
          test -f cpanel-package/scripts/seed.mjs

          if [ -e cpanel-package/node_modules ]; then
            echo "ERROR: node_modules masih ada."
            exit 1
          fi

          echo ""
          echo "================================="
          echo "CPANEL PACKAGE READY"
          echo "================================="

          ls -lah cpanel-package

      # ==========================================================
      # ARTIFACT BACKUP
      # ==========================================================

      - name: Upload cPanel package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-next-cpanel
          path: cpanel-package/
          include-hidden-files: true
          retention-days: 7

      # ==========================================================
      # VALIDATE SSH SECRETS
      # ==========================================================

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e

          echo "Checking deployment configuration..."

          if [ -z "$CPANEL_HOST" ]; then
            echo "ERROR: CPANEL_HOST kosong."
            exit 1
          fi

          if [ -z "$CPANEL_USER" ]; then
            echo "ERROR: CPANEL_USER kosong."
            exit 1
          fi

          if [ -z "$CPANEL_PORT" ]; then
            echo "ERROR: CPANEL_SSH_PORT kosong."
            exit 1
          fi

          if [ -z "$CPANEL_APP_DIR" ]; then
            echo "ERROR: CPANEL_APP_DIR kosong."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: CPANEL_SSH_KEY kosong."
            exit 1
          fi

          if ! echo "$CPANEL_PORT" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: CPANEL_SSH_PORT harus berupa angka."
            exit 1
          fi

          if [ "$CPANEL_APP_DIR" != \
            "/home/ucv04la6/Pos-Next-Js/cpanel-runtime" ]; then

            echo "ERROR: CPANEL_APP_DIR tidak sesuai."
            echo "Expected:"
            echo "/home/ucv04la6/Pos-Next-Js/cpanel-runtime"
            echo "Actual:"
            echo "$CPANEL_APP_DIR"
            exit 1
          fi

          echo ""
          echo "SSH configuration OK."
          echo "Host: $CPANEL_HOST"
          echo "User: $CPANEL_USER"
          echo "Port: $CPANEL_PORT"
          echo "App:  $CPANEL_APP_DIR"

      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$CPANEL_PORT" \
            "$CPANEL_HOST" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          echo "SSH ready."

      # ==========================================================
      # TEST SSH
      # ==========================================================

      - name: Test SSH connection
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo SSH_OK"

      # ==========================================================
      # REMOTE BACKUP
      # ==========================================================

      - name: Backup current deployment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'
              BACKUP=\"\${APP}.backup-\$(date +%Y%m%d-%H%M%S)\"

              mkdir -p \"\$BACKUP\"

              if [ -f \"\$APP/server.js\" ]; then
                cp -a \"\$APP/server.js\" \"\$BACKUP/\"
              fi

              if [ -d \"\$APP/.next\" ]; then
                cp -a \"\$APP/.next\" \"\$BACKUP/\"
              fi

              if [ -d \"\$APP/public\" ]; then
                cp -a \"\$APP/public\" \"\$BACKUP/\"
              fi

              if [ -f \"\$APP/package.json\" ]; then
                cp -a \"\$APP/package.json\" \"\$BACKUP/\"
              fi

              echo \"Backup created: \$BACKUP\"
            "

      # ==========================================================
      # DEPLOY FILES
      #
      # PENTING:
      # .env TIDAK DIHAPUS
      # node_modules TIDAK DIHAPUS
      # tmp TIDAK DIHAPUS
      #
      # ==========================================================

      - name: Deploy application files
        run: |
          set -e

          tar \
            -C cpanel-package \
            -czf - . \
          | ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              mkdir -p \"\$APP\"

              tar -xzf - -C \"\$APP\"

              echo ''
              echo 'Deployment files extracted.'
            "

      # ==========================================================
      # VERIFY / REPAIR NODE_MODULES SYMLINK
      # ==========================================================

      - name: Verify CloudLinux node_modules
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              EXPECTED='/home/ucv04la6/nodevenv/Pos-Next-Js/cpanel-runtime/22/lib/node_modules'

              echo '=== node_modules ==='

              if [ -L \"\$APP/node_modules\" ]; then

                TARGET=\$(readlink \"\$APP/node_modules\")

                echo \"Symlink: \$TARGET\"

                if [ \"\$TARGET\" != \"\$EXPECTED\" ]; then
                  echo 'ERROR: node_modules symlink salah.'
                  exit 1
                fi

              elif [ -e \"\$APP/node_modules\" ]; then

                echo 'ERROR: node_modules bukan symlink.'
                exit 1

              else

                echo 'node_modules symlink tidak ada.'
                echo 'Membuat ulang...'

                ln -s \
                  \"\$EXPECTED\" \
                  \"\$APP/node_modules\"
              fi

              echo ''
              echo 'node_modules OK.'

              test -d \"\$APP/node_modules/@prisma/client\"
              test -d \"\$APP/node_modules/.prisma/client\"

              test -f \
                \"\$APP/node_modules/.prisma/client/libquery_engine-debian-openssl-1.1.x.so.node\"

              echo ''
              echo 'Prisma runtime OK.'
            "

      # ==========================================================
      # VERIFY .ENV
      # ==========================================================

      - name: Verify production environment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              test -f \"\$APP/.env\"

              echo '.env exists.'

              grep '^DATABASE_URL=' \
                \"\$APP/.env\" \
                | sed 's/=.*$/=<SET>/'
            "

      # ==========================================================
      # RESTART NEXT.JS 3210
      # ==========================================================

      - name: Restart Next.js 3210
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'
              NODE='/home/ucv04la6/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/node'

              mkdir -p \"\$APP/tmp\"

              # --------------------------------------------------
              # Stop process lama menggunakan PID file.
              # --------------------------------------------------

              if [ -f \"\$APP/tmp/next-3210.pid\" ]; then

                PID=\$(cat \
                  \"\$APP/tmp/next-3210.pid\" \
                  2>/dev/null || true)

                if [ -n \"\$PID\" ]; then

                  echo \"Stopping PID \$PID...\"

                  kill \"\$PID\" \
                    2>/dev/null || true

                fi
              fi

              sleep 3

              # --------------------------------------------------
              # Pastikan node_modules benar.
              # --------------------------------------------------

              test -L \"\$APP/node_modules\"

              # --------------------------------------------------
              # Pastikan .env tersedia.
              # --------------------------------------------------

              test -f \"\$APP/.env\"

              # --------------------------------------------------
              # Load production environment.
              # --------------------------------------------------

              cd \"\$APP\"

              set -a
              . ./.env
              set +a

              # --------------------------------------------------
              # Start Next.js.
              # --------------------------------------------------

              echo 'Starting Next.js on port 3210...'

              nohup env \
                NODE_ENV=production \
                HOSTNAME=127.0.0.1 \
                PORT=3210 \
                \"\$NODE\" \
                server.js \
                > tmp/next-3210.log 2>&1 &

              echo \$! > tmp/next-3210.pid

              sleep 5

              echo ''
              echo '=== PID ==='
              cat tmp/next-3210.pid

              echo ''
              echo '=== Next.js log ==='
              tail -80 tmp/next-3210.log
            "

      # ==========================================================
      # HEALTH CHECK LOCAL
      # ==========================================================

      - name: Health check Next.js
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              echo '=== Local HTTP 3210 ==='

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 20 \
                http://127.0.0.1:3210/ \
                -o /tmp/next-health.html

              grep -q 'POSQU' \
                /tmp/next-health.html

              echo 'NEXT_HEALTH_OK'
            "

      # ==========================================================
      # VERIFY REMOTE DEPLOYMENT
      # ==========================================================

      - name: Verify remote deployment
        run: |
          set -e

          ssh \
            -p "$CPANEL_PORT" \
            -o BatchMode=yes \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              set -e

              APP='$CPANEL_APP_DIR'

              test -f \"\$APP/server.js\"
              test -f \"\$APP/package.json\"
              test -d \"\$APP/.next\"
              test -f \"\$APP/.env\"
              test -L \"\$APP/node_modules\"
              test -f \"\$APP/tmp/next-3210.pid\"

              echo ''
              echo '================================='
              echo 'DEPLOYMENT VERIFIED'
              echo '================================='
            "
