name: Build Next.js for cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
      DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Show versions
        run: node -v && npm -v

      - name: Check package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json tidak ditemukan."
            exit 1
          fi
          echo "OK: package-lock.json ditemukan."

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify Prisma CLI
        run: |
          test -f node_modules/.bin/prisma
          ./node_modules/.bin/prisma --version

      - name: Generate Prisma Client
        run: |
          unset PRISMA_QUERY_ENGINE_LIBRARY
          ./node_modules/.bin/prisma generate --schema src/prisma/schema.prisma
          test -d node_modules/.prisma/client
          test -d node_modules/@prisma/client
          echo "Prisma Client generated."

      - name: Verify Prisma engines
        run: |
          find node_modules/.prisma/client -maxdepth 1 -type f \( -name "*query_engine*" -o -name "*libquery_engine*" \) -print

      - name: Build Next.js
        run: npm run build

      - name: Verify build output
        run: |
          test -d .next/standalone
          test -f $(find .next/standalone -type f -name "server.js" | head -n 1)
          echo "Build verified."

      - name: Prepare cPanel package
        run: |
          set -e
          rm -rf cpanel-package
          mkdir -p cpanel-package

          SERVER_JS=$(find .next/standalone -type f -name "server.js" | head -n 1)
          SERVER_DIR=$(dirname "$SERVER_JS")
          cp -a "$SERVER_DIR"/. cpanel-package/

          [ -d public ] && { mkdir -p cpanel-package/public; cp -a public/. cpanel-package/public/; }
          [ -d .next/static ] && { mkdir -p cpanel-package/.next; cp -a .next/static cpanel-package/.next/; }

          mkdir -p cpanel-package/node_modules/@prisma
          mkdir -p cpanel-package/node_modules/.prisma
          cp -a node_modules/@prisma/client cpanel-package/node_modules/@prisma/client
          cp -a node_modules/.prisma/client cpanel-package/node_modules/.prisma/client
          cp -a node_modules/bcryptjs cpanel-package/node_modules/bcryptjs
          mkdir -p cpanel-package/scripts
          cp scripts/seed.mjs cpanel-package/scripts/seed.mjs

          rm -f cpanel-package/.env cpanel-package/.env.production cpanel-package/.env.local

          echo "Package ready."
          test -f cpanel-package/server.js
          test -f cpanel-package/package.json
          test -d cpanel-package/.next
          test -d cpanel-package/node_modules
          echo "All checks passed."

      - name: Setup SSH for cPanel
        if: ${{ secrets.CPANEL_HOST != '' && secrets.CPANEL_SSH_KEY != '' }}
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e
          echo "Setup SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || '22' }} "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          echo "SSH ready."

      - name: Deploy to cPanel
        if: ${{ secrets.CPANEL_HOST != '' && secrets.CPANEL_SSH_KEY != '' }}
        run: |
          set -e
          echo "Deploy to cPanel..."
          PORT=${{ secrets.CPANEL_SSH_PORT || '22' }}
          ssh -p "$PORT" -o BatchMode=yes "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "mkdir -p '${{ secrets.CPANEL_APP_DIR }}'"
          ssh -p "$PORT" -o BatchMode=yes "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "find '${{ secrets.CPANEL_APP_DIR }}' -mindepth 1 -maxdepth 1 ! -name '.env' ! -name 'tmp' -exec rm -rf {} +"
          tar -C cpanel-package -czf - . | ssh -p "$PORT" -o BatchMode=yes "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "tar -xzf - -C '${{ secrets.CPANEL_APP_DIR }}'"
          ssh -p "$PORT" -o BatchMode=yes "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" "mkdir -p '${{ secrets.CPANEL_APP_DIR }}/tmp' && touch '${{ secrets.CPANEL_APP_DIR }}/tmp/restart.txt'"
          echo "Deploy success."