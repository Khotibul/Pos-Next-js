name: Deploy to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: posqupro-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PRISMA_SCHEMA: "src/prisma/schema.prisma"
  SSH_PORT: "22"

jobs:
  # ================================================================
  # JOB 1: BUILD (always succeeds, produces artifact)
  # ================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          set -e
          for f in package.json package-lock.json next.config.mjs "$PRISMA_SCHEMA"; do
            test -f "$f" || { echo "ERROR: $f tidak ditemukan."; exit 1; }
          done
          grep -q 'output.*"standalone"' next.config.mjs \
            || { echo "ERROR: next.config.mjs harus output: standalone."; exit 1; }
          echo "Repository OK."

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client (build-time)
        env:
          DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"
        run: npx prisma generate --schema "$PRISMA_SCHEMA"

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
          DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify standalone build
        run: |
          set -e
          test -d .next/standalone || { echo "ERROR: .next/standalone tidak ada."; exit 1; }
          test -f .next/standalone/server.js || { echo "ERROR: server.js tidak ditemukan."; exit 1; }
          echo "Standalone build OK."

      - name: Package for cPanel
        run: |
          set -e
          rm -rf cpanel-package
          mkdir -p cpanel-package

          SERVER_DIR=$(dirname "$(find .next/standalone -type f -name "server.js" | head -n 1)")
          cp -a "$SERVER_DIR"/. cpanel-package/

          [ -d public ] && { mkdir -p cpanel-package/public; cp -a public/. cpanel-package/public/; }
          [ -d .next/static ] && { mkdir -p cpanel-package/.next; cp -a .next/static cpanel-package/.next/; }

          cp package.json cpanel-package/package.json
          cp package-lock.json cpanel-package/package-lock.json

          mkdir -p cpanel-package/src/prisma
          cp "$PRISMA_SCHEMA" cpanel-package/src/prisma/schema.prisma
          [ -d src/prisma/migrations ] && cp -a src/prisma/migrations cpanel-package/src/prisma/migrations

          rm -f cpanel-package/.env cpanel-package/.env.* cpanel-package/.env.local

          test -f cpanel-package/server.js    || { echo "ERROR: server.js missing."; exit 1; }
          test -f cpanel-package/package.json || { echo "ERROR: package.json missing."; exit 1; }
          test -d cpanel-package/node_modules || { echo "ERROR: node_modules/ missing."; exit 1; }
          test -d cpanel-package/.next        || { echo "ERROR: .next/ missing."; exit 1; }
          echo "Package OK."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posqupro-deploy
          path: cpanel-package/
          retention-days: 3

  # ================================================================
  # JOB 2: DEPLOY (best-effort, SSH may fail due to firewall)
  # ================================================================
  deploy:
    name: Deploy to cPanel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: posqupro-deploy
          path: cpanel-package

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1 || {
            echo "ERROR: Invalid SSH key in CPANEL_SSH_KEY_B64"
            exit 1
          }
          ssh-keyscan -p "${{ env.SSH_PORT }}" "${{ secrets.CPANEL_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          echo "SSH key loaded."

      - name: Deploy to cPanel via SSH
        id: ssh_deploy
        run: |
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -i ~/.ssh/id_ed25519"
          SSH_PORT="${{ env.SSH_PORT }}"
          TARGET="${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}"

          echo "=== SSH configuration ==="
          echo "SSH_PORT=$SSH_PORT"
          echo "TARGET=$TARGET"
          echo "SSH_OPTS=$SSH_OPTS"

          test -f ~/.ssh/id_ed25519 || { echo "ERROR: SSH private key not found"; exit 1; }

          echo ""
          echo "=== SSH connectivity test ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "$TARGET" "echo 'SSH OK: '$(hostname)"

          echo ""
          echo "=== Uploading package ==="
          tar czf cpanel-package.tar.gz cpanel-package/
          scp -P "$SSH_PORT" $SSH_OPTS cpanel-package.tar.gz "$TARGET:/tmp/cpanel-package.tar.gz"

          echo ""
          echo "=== Extracting on server ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "$TARGET" "
            set -e
            APP='${{ secrets.CPANEL_APP_DIR }}'
            rm -rf /tmp/cpanel-extract && mkdir -p /tmp/cpanel-extract
            cd /tmp/cpanel-extract && tar xzf /tmp/cpanel-package.tar.gz && cd cpanel-package
            test -f server.js || { echo 'ERROR: server.js missing'; exit 1; }
            rsync -a --delete --exclude='.env' --exclude='.env.*' --exclude='tmp/' ./ \"\$APP/\"
            mkdir -p \"\$APP/tmp\"
            rm -rf /tmp/cpanel-extract /tmp/cpanel-package.tar.gz
            echo 'Package deployed.'
          "

          echo ""
          echo "=== Prisma generate ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "$TARGET" "
            APP='${{ secrets.CPANEL_APP_DIR }}'
            NPM=\"/home/${{ secrets.CPANEL_USER }}/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/npm\"
            cd \"\$APP\"
            grep -q '^NODE_ENV=' \"\$APP/.env\" || echo 'NODE_ENV=production' >> \"\$APP/.env\"
            grep -q '^HOSTNAME=' \"\$APP/.env\" || echo 'HOSTNAME=0.0.0.0' >> \"\$APP/.env\"
            export \$(grep -E '^(DATABASE_URL|DIRECT_URL)=' \"\$APP/.env\" | xargs)
            \"\$NPM\" exec --yes -- prisma generate --schema src/prisma/schema.prisma 2>&1
            test -d \"\$APP/node_modules/.prisma/client\" || { echo 'ERROR: .prisma/client missing'; exit 1; }
            echo 'Prisma OK.'
          "

          echo ""
          echo "=== Database migration ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "$TARGET" "
            APP='${{ secrets.CPANEL_APP_DIR }}'
            NPM=\"/home/${{ secrets.CPANEL_USER }}/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/npm\"
            cd \"\$APP\"
            export \$(grep -E '^(DATABASE_URL|DIRECT_URL)=' \"\$APP/.env\" | xargs)
            \"\$NPM\" exec --yes -- prisma migrate deploy --schema src/prisma/schema.prisma 2>&1
            echo 'Migration complete.'
          "

          echo ""
          echo "=== Restart Passenger ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "$TARGET" "
            APP='${{ secrets.CPANEL_APP_DIR }}'
            mkdir -p \"\$APP/tmp\" && touch \"\$APP/tmp/restart.txt\"
            echo 'Passenger restarted.'
          "

          echo "SSH_DEPLOY_OK=true" >> "$GITHUB_OUTPUT"

      - name: Health check (only if SSH deploy succeeded)
        if: steps.ssh_deploy.outcome == 'success'
        run: |
          echo "Waiting 20s for server..."
          sleep 20
          MAX=12; ATTEMPT=1
          while [ $ATTEMPT -le $MAX ]; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://${{ secrets.CPANEL_HOST }}/" 2>/dev/null || echo "000")
            echo "Attempt $ATTEMPT/$MAX: HTTP $CODE"
            [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ] && { echo "Server healthy!"; exit 0; }
            ATTEMPT=$((ATTEMPT + 1)); sleep 10
          done
          echo "WARNING: Health check failed — server may need manual restart."

      - name: Deploy result
        if: always()
        run: |
          if [ "${{ steps.ssh_deploy.outcome }}" = "success" ]; then
            echo "========================================="
            echo "  DEPLOY COMPLETE"
            echo "  https://${{ secrets.CPANEL_HOST }}"
            echo "========================================="
          else
            echo "============================================="
            echo "  SSH DEPLOY FAILED — Manual deployment needed"
            echo "============================================="
            echo ""
            echo "GitHub Actions cannot reach your server via SSH."
            echo "This is a firewall issue on your hosting."
            echo ""
            echo "OPTION A: Deploy manually from Windows"
            echo "  1. Download artifact from this workflow run"
            echo "  2. Extract to server: /home/ucv04la6/Pos-Next-Js"
            echo "  3. Run: ./deploy.sh"
            echo ""
            echo "OPTION B: Fix firewall (whitelist GitHub IPs)"
            echo "  1. Get runner IP from this workflow's previous step"
            echo "  2. On server: csf -a <RUNNER_IP> 'GitHub Actions'"
            echo ""
            echo "OPTION C: Self-hosted runner"
            echo "  Install GitHub Actions runner on your VPS"
            echo "  https://github.com/actions/runner"
            echo "============================================="
          fi
