name: Deploy to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: posqupro-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PRISMA_SCHEMA: "src/prisma/schema.prisma"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==========================================================
      # VALIDATE REPOSITORY
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          set -e

          for f in package.json package-lock.json next.config.mjs "$PRISMA_SCHEMA"; do
            test -f "$f" || { echo "ERROR: $f tidak ditemukan."; exit 1; }
          done

          grep -q 'output.*"standalone"' next.config.mjs \
            || { echo "ERROR: next.config.mjs harus output: standalone."; exit 1; }

          echo "Repository OK."

      - name: Validate Prisma binary targets
        run: |
          set -e

          for target in "debian-openssl-1.0.x" "debian-openssl-1.1.x" "debian-openssl-3.0.x"; do
            grep -q "$target" "$PRISMA_SCHEMA" \
              || { echo "ERROR: binary target $target tidak ada di schema."; exit 1; }
          done

          echo "Prisma binary targets OK."

      # ==========================================================
      # SETUP NODE + INSTALL + GENERATE + BUILD
      # ==========================================================

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client (build-time)
        env:
          DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"
        run: npx prisma generate --schema "$PRISMA_SCHEMA"

      - name: Verify Prisma engine binaries
        run: |
          set -e

          for target in "debian-openssl-1.0.x" "debian-openssl-1.1.x" "debian-openssl-3.0.x"; do
            test -d "node_modules/.prisma/client" \
              || { echo "ERROR: .prisma/client tidak ada."; exit 1; }
          done

          echo "Prisma engine binaries OK."

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
          DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify standalone build
        run: |
          set -e

          test -d .next/standalone \
            || { echo "ERROR: .next/standalone tidak ada."; exit 1; }

          SERVER_JS=$(find .next/standalone -type f -name "server.js" | head -n 1)
          test -n "$SERVER_JS" \
            || { echo "ERROR: server.js tidak ditemukan."; exit 1; }

          echo "Standalone build OK."

      # ==========================================================
      # PACKAGE FOR CPANEL
      # ==========================================================

      - name: Package for cPanel
        run: |
          set -e

          rm -rf cpanel-package
          mkdir -p cpanel-package

          SERVER_JS=$(find .next/standalone -type f -name "server.js" | head -n 1)
          SERVER_DIR=$(dirname "$SERVER_JS")

          cp -a "$SERVER_DIR"/. cpanel-package/

          if [ -d public ]; then
            mkdir -p cpanel-package/public
            cp -a public/. cpanel-package/public/
          fi

          if [ -d .next/static ]; then
            mkdir -p cpanel-package/.next
            cp -a .next/static cpanel-package/.next/
          fi

          cp package.json cpanel-package/package.json
          cp package-lock.json cpanel-package/package-lock.json

          mkdir -p cpanel-package/src/prisma
          cp "$PRISMA_SCHEMA" cpanel-package/src/prisma/schema.prisma

          if [ -d src/prisma/migrations ]; then
            cp -a src/prisma/migrations cpanel-package/src/prisma/migrations
          fi

          rm -f cpanel-package/.env cpanel-package/.env.* cpanel-package/.env.local

          test -f cpanel-package/server.js     || { echo "ERROR: server.js missing."; exit 1; }
          test -f cpanel-package/package.json  || { echo "ERROR: package.json missing."; exit 1; }
          test -d cpanel-package/node_modules  || { echo "ERROR: node_modules/ missing."; exit 1; }
          test -d cpanel-package/.next         || { echo "ERROR: .next/ missing."; exit 1; }

          echo "Package OK."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posqupro-deploy
          path: cpanel-package/
          retention-days: 3

      # ==========================================================
      # VALIDATE SECRETS
      # ==========================================================

      - name: Validate required secrets
        run: |
          set -e

          test -n "${{ secrets.CPANEL_HOST }}"       || { echo "ERROR: Set CPANEL_HOST secret (e.g. posqupro.co-id.id)."; exit 1; }
          test -n "${{ secrets.CPANEL_USER }}"        || { echo "ERROR: Set CPANEL_USER secret (cPanel username)."; exit 1; }
          test -n "${{ secrets.CPANEL_SSH_PORT }}"    || { echo "ERROR: Set CPANEL_SSH_PORT secret (e.g. 22)."; exit 1; }
          test -n "${{ secrets.CPANEL_SSH_KEY_B64 }}" || { echo "ERROR: Set CPANEL_SSH_KEY_B64 secret (base64-encoded SSH private key)."; exit 1; }
          test -n "${{ secrets.CPANEL_APP_DIR }}"     || { echo "ERROR: Set CPANEL_APP_DIR secret (e.g. /home/user/app)."; exit 1; }

          echo "${{ secrets.CPANEL_SSH_PORT }}" | grep -qE '^[0-9]+$' \
            || { echo "ERROR: CPANEL_SSH_PORT must be a number, got: ${{ secrets.CPANEL_SSH_PORT }}"; exit 1; }

          echo "All secrets validated."

      # ==========================================================
      # SETUP SSH
      # ==========================================================

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519 || {
            echo "ERROR: Failed to base64-decode CPANEL_SSH_KEY_B64."
            echo "Fix: Generate a new key with: ssh-keygen -t ed25519 -N '' -f deploy_key"
            echo "Then: cat deploy_key | base64"
            exit 1
          }
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1 || {
            echo "ERROR: Decoded file is not a valid SSH private key."
            echo "File size: $(wc -c < ~/.ssh/id_ed25519) bytes"
            echo "Fix: Ensure CPANEL_SSH_KEY_B64 contains base64 of a PRIVATE key (not public key)."
            echo "Command: cat deploy_key | base64   (where deploy_key is the private key file)"
            exit 1
          }

          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" "${{ secrets.CPANEL_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

          chmod 644 ~/.ssh/known_hosts
          echo "SSH key loaded."

      - name: Test SSH connection
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "echo 'SSH OK: '$(hostname)" \
          || {
            echo ""
            echo "============================================="
            echo "SSH CONNECTION FAILED"
            echo "============================================="
            echo "Host:     ${{ secrets.CPANEL_HOST }}"
            echo "Port:     ${{ secrets.CPANEL_SSH_PORT }}"
            echo "User:     ${{ secrets.CPANEL_USER }}"
            echo ""
            echo "Common fixes:"
            echo "1. CPANEL_SSH_PORT must be 22 (not 2222)"
            echo "2. SSH key must be ed25519 private key (not public)"
            echo "3. Key must NOT be password-protected"
            echo "4. Add deploy key to cPanel: SSH Access > Manage SSH Keys"
            echo "============================================="
            exit 1
          }

      # ==========================================================
      # BACKUP CURRENT DEPLOYMENT
      # ==========================================================

      - name: Backup current deployment
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'
              BACKUP=\"/home/${{ secrets.CPANEL_USER }}/backups/posqupro-\$(date +%Y%m%d-%H%M%S)\"
              if [ -d \"\$APP/.next\" ]; then
                mkdir -p \"\$BACKUP\"
                cp -a \"\$APP\"/.next \"\$BACKUP\"/ 2>/dev/null || true
                cp -a \"\$APP\"/server.js \"\$BACKUP\"/ 2>/dev/null || true
                cp -a \"\$APP\"/package.json \"\$BACKUP\"/ 2>/dev/null || true
                echo \"Backup: \$BACKUP\"
              else
                echo 'No previous deployment to backup.'
              fi
            "

      # ==========================================================
      # DEPLOY PACKAGE TO CPANEL
      # ==========================================================

      - name: Deploy to cPanel
        run: |
          set -e

          tar czf cpanel-package.tar.gz cpanel-package/

          scp \
            -p \
            -P "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            cpanel-package.tar.gz \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/tmp/cpanel-package.tar.gz"

          echo "Package uploaded."

          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'

              echo '=== Extracting package ==='
              rm -rf /tmp/cpanel-extract
              mkdir -p /tmp/cpanel-extract
              cd /tmp/cpanel-extract
              tar xzf /tmp/cpanel-package.tar.gz
              cd cpanel-package

              test -f server.js    || { echo 'ERROR: server.js missing in package'; exit 1; }
              test -f package.json || { echo 'ERROR: package.json missing in package'; exit 1; }
              test -d node_modules || { echo 'ERROR: node_modules/ missing in package'; exit 1; }
              test -d .next        || { echo 'ERROR: .next/ missing in package'; exit 1; }

              echo '=== Syncing to app directory ==='
              rsync -a --delete \
                --exclude='.env' \
                --exclude='.env.*' \
                --exclude='.env.local' \
                --exclude='tmp/' \
                ./ \"\$APP/\"

              test -f \"\$APP/server.js\"    || { echo 'ERROR: server.js missing after sync'; exit 1; }
              test -f \"\$APP/package.json\"  || { echo 'ERROR: package.json missing after sync'; exit 1; }
              test -d \"\$APP/node_modules\"  || { echo 'ERROR: node_modules/ missing after sync'; exit 1; }
              test -f \"\$APP/.env\"          || { echo 'ERROR: .env missing after sync'; exit 1; }

              mkdir -p \"\$APP/tmp\"
              rm -rf /tmp/cpanel-extract /tmp/cpanel-package.tar.gz
              echo 'Package deployed.'
            "

      # ==========================================================
      # INSTALL PRODUCTION DEPS + PRISMA ON SERVER
      # ==========================================================

      - name: Install production deps on server
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'
              NPM=\"/home/${{ secrets.CPANEL_USER }}/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/npm\"
              cd \"\$APP\"

              test -f package.json || { echo 'ERROR: package.json not found'; exit 1; }

              echo '=== npm install --omit=dev ==='
              \"\$NPM\" install --omit=dev --no-audit --no-fund 2>&1

              test -d \"\$APP/node_modules/next\"       || { echo 'ERROR: next missing'; exit 1; }
              test -d \"\$APP/node_modules/@prisma/client\" || { echo 'ERROR: @prisma/client missing'; exit 1; }

              echo '=== prisma generate ==='
              \"\$NPM\" exec --yes -- prisma generate --schema src/prisma/schema.prisma 2>&1

              test -d \"\$APP/node_modules/.prisma/client\" || { echo 'ERROR: .prisma/client missing'; exit 1; }
              test -f \"\$APP/.env\" || { echo 'ERROR: .env missing'; exit 1; }

              grep -q '^NODE_ENV=' \"\$APP/.env\" || echo 'NODE_ENV=production' >> \"\$APP/.env\"
              grep -q '^HOSTNAME=' \"\$APP/.env\" || echo 'HOSTNAME=0.0.0.0' >> \"\$APP/.env\"

              echo 'Production deps + Prisma OK.'
            "

      # ==========================================================
      # DATABASE MIGRATION (via SSH — DB is localhost only)
      # ==========================================================

      - name: Run database migration on server
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'
              NPM=\"/home/${{ secrets.CPANEL_USER }}/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/npm\"

              if [ -f \"\$APP/.env\" ]; then
                export \$(grep -E '^(DATABASE_URL|DIRECT_URL)=' \"\$APP/.env\" | xargs)
              fi

              if [ -z \"\$DATABASE_URL\" ]; then
                echo 'ERROR: DATABASE_URL not found in .env'
                exit 1
              fi

              cd \"\$APP\"

              echo '=== Baseline: create _prisma_migrations table ==='
              \"\$NPM\" exec --yes -- prisma db execute \
                --schema src/prisma/schema.prisma \
                --stdin \
                <<< 'CREATE TABLE IF NOT EXISTS \"_prisma_migrations\" (
                  \"id\"                      TEXT NOT NULL DEFAULT gen_random_uuid()::text,
                  \"checksum\"                TEXT NOT NULL,
                  \"finished_at\"             TIMESTAMP(3),
                  \"migration_name\"          TEXT NOT NULL,
                  \"logs\"                    TEXT,
                  \"rolled_back_at\"          TIMESTAMP(3),
                  \"started_at\"              TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  \"applied_steps_count\"     INTEGER NOT NULL DEFAULT 0,
                  PRIMARY KEY (\"id\")
                );'

              echo ''
              echo '=== Baseline: mark existing migrations as applied ==='
              EXISTING_MIGRATIONS='
              20260520233403_init
              20260521103000_add_license_keys
              20260524090000_shiftbook_qrcode
              20260527034016
              20260527104155
              20260527145038
              20260530090000_monitoring_logs
              20260612090000_user_email_lower_index
              20260706090000_add_audit_log_tenant_created_idx
              20260707090000_add_pg_trgm_search_indexes
              20260820000000_sync_schema_drift
              20260823000000_pos_performance_indexes'

              for migration in \$EXISTING_MIGRATIONS; do
                [ -z \"\$migration\" ] && continue
                echo \"  Resolving: \$migration\"
                \"\$NPM\" exec --yes -- prisma migrate resolve \
                  --applied \"\$migration\" \
                  --schema src/prisma/schema.prisma
              done

              echo ''
              echo '=== Deploy pending migrations ==='
              \"\$NPM\" exec --yes -- prisma migrate deploy \
                --schema src/prisma/schema.prisma 2>&1

              echo ''
              echo '=== Migration complete ==='
            "

      - name: Verify migration results on server
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'
              NPM=\"/home/${{ secrets.CPANEL_USER }}/nodevenv/Pos-Next-Js/cpanel-runtime/22/bin/npm\"

              if [ -f \"\$APP/.env\" ]; then
                export \$(grep -E '^(DATABASE_URL|DIRECT_URL)=' \"\$APP/.env\" | xargs)
              fi

              cd \"\$APP\"

              echo '=== Verifying DebtStatus enum ==='
              \"\$NPM\" exec --yes -- prisma db execute \
                --schema src/prisma/schema.prisma \
                --stdin \
                <<< \"DO \\\$\\\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'DebtStatus') THEN
                  RAISE EXCEPTION 'DebtStatus enum not found';
                END IF;
              END
              \\\$\\\$;\"

              echo '=== Verifying tables ==='
              for table in Receivable ReceivablePayment Payable PayablePayment; do
                \"\$NPM\" exec --yes -- prisma db execute \
                  --schema src/prisma/schema.prisma \
                  --stdin \
                  <<< \"DO \\\$\\\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = '\$table') THEN
                  RAISE EXCEPTION '\$table table not found';
                END IF;
              END
              \\\$\\\$;\"
                echo \"  \$table OK\"
              done

              echo '=== All verifications passed ==='
            "

      # ==========================================================
      # RESTART PASSENGER
      # ==========================================================

      - name: Restart Passenger
        run: |
          ssh \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "
              set -e
              APP='${{ secrets.CPANEL_APP_DIR }}'
              mkdir -p \"\$APP/tmp\"
              touch \"\$APP/tmp/restart.txt\"
              echo 'Passenger restart triggered.'
            "

      # ==========================================================
      # HEALTH CHECK
      # ==========================================================

      - name: Wait for server ready
        run: sleep 15

      - name: Health check
        run: |
          set -e

          MAX_ATTEMPTS=12
          ATTEMPT=1

          while [ \$ATTEMPT -le \$MAX_ATTEMPTS ]; do
            echo "Attempt \$ATTEMPT/\$MAX_ATTEMPTS..."

            HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' \
              --connect-timeout 5 \
              --max-time 10 \
              "https://${{ secrets.CPANEL_HOST }}/" 2>/dev/null || echo "000")

            echo "  HTTP \$HTTP_CODE"

            if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "301" ] || [ "\$HTTP_CODE" = "302" ]; then
              echo ""
              echo "=== Server is healthy (HTTP \$HTTP_CODE) ==="
              exit 0
            fi

            ATTEMPT=\$((ATTEMPT + 1))
            sleep 10
          done

          echo ""
          echo "ERROR: Server did not become healthy after \$MAX_ATTEMPTS attempts."
          exit 1

      # ==========================================================
      # DONE
      # ==========================================================

      - name: Deploy summary
        run: |
          echo "========================================="
          echo "  DEPLOY COMPLETE"
          echo "========================================="
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "========================================="
