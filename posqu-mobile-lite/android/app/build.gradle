plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Keystore release hanya dipakai jika file-nya tersedia. Tanpa file (mis. di
// mesin developer/CI yang tidak menyimpan secret), build tetap jalan dengan
// signing debug agar APK tetap bisa di-sideload. Taruh upload-keystore.jks di
// folder ini + isi key.properties untuk signing release sungguhan.
def releaseStoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace "com.posqu.mobile.lite"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.posqu.mobile.lite"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Fallback ke debug signing bila keystore release belum tersedia
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // Play Protect: signed release (bukan debug) + shrinkResources nonaktifkan untuk sideload stabil
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // tetap pakai debug untuk development
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10"
}
