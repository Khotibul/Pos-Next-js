name: posqu_mobile_lite
description: Aplikasi POS UMKM - Offline First dengan Clean Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local Database (Drift SQLite)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.22
  sqlite3: ^2.4.4
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cache & Local Config
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # UI & Theme
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.0
  flutter_animate: ^4.5.0

  # Barcode Scanning
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Printing (Bluetooth ESC/POS)
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4

  # Image Picker
  image_picker: ^1.0.7

  # Connectivity
  connectivity_plus: ^6.0.3

  # Local Auth
  local_auth: ^2.2.0

  # Google Sign In
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  logger: ^2.3.0
  fluttertoast: ^8.2.4
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6

  # Functional Programming
  dartz: ^0.10.1

  # Environment
  flutter_dotenv: ^5.1.0

  # Responsive
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.19.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env